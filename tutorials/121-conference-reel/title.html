<!doctype html><html><head><style>
@font-face{font-family:Inter;src:url('../_kit/fonts/Inter-VF.ttf');font-weight:100 900}
html,body{margin:0;width:3840px;height:2160px;background:transparent;overflow:hidden}
.pill{position:absolute;left:150px;bottom:150px;font:300 92px/1.15 Inter;letter-spacing:-1.5px;color:#17191d;background:rgba(255,255,255,.94);padding:38px 64px;border-radius:999px;box-shadow:0 18px 60px rgba(0,0,0,.18)}
.tag{position:absolute;right:150px;top:120px;font:400 64px/1 Inter;letter-spacing:-.5px;color:#fff;background:rgba(23,25,29,.82);padding:26px 46px;border-radius:999px}
.tag i{display:inline-block;width:22px;height:22px;border-radius:50%;background:#2463eb;margin-right:22px;vertical-align:4px}
.card{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:90px;font:300 120px/1.1 Inter;letter-spacing:-2.5px;color:#17191d}
.card img{height:200px}
</style></head><body><script>
const p=new URLSearchParams(location.hash.slice(1)),k=p.get('kind'),t=p.get('text')||'';
document.body.innerHTML=k==='tag'?`<div class="tag"><i></i></div>`:k==='card'?`<div class="card"><img src="../_kit/brand/DEVIN_AVATAR_SQUARE_BLACK_NO_BG.png"><div></div></div>`:`<div class="pill"></div>`;
(document.querySelector('.tag')||document.querySelector('.card div')||document.querySelector('.pill')).append(t);
</script></body></html>
