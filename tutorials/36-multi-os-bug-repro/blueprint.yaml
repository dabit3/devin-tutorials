runs-on: default
maintenance: |
  source ~/.nvm/nvm.sh
  (cd kanban-board && npm install)
  (cd desktop/tally && npm install)
knowledge:
  - name: kanban-board
    contents: |
      # Node via nvm: source ~/.nvm/nvm.sh
      # cd kanban-board && npm run dev | npm run build | npm run lint
  - name: tally
    contents: cd desktop/tally && npm test && npm start
---
runs-on: [macos, windows]
initialize:
  - name: Install Node.js
    uses: github.com/actions/setup-node@v4
    with:
      node-version: "24"
maintenance: |
  cd desktop/tally && npm install
knowledge:
  - name: tally
    contents: cd desktop/tally && npm test && npm start
