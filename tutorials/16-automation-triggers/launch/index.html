<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Inter'; src: url('../../_kit/fonts/Inter-VF.ttf') format('truetype'); font-weight: 100 900; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
* { box-sizing: border-box; }
#stage { position: absolute; inset: 0; overflow: hidden; font-family: 'Inter', sans-serif; color: #0a0a0a;
  background: radial-gradient(ellipse 80% 70% at 50% 42%, #ffffff 0%, #f7f7f8 55%, #ececee 100%); }
.card { position: absolute; left: 200px; top: 196px; width: 1520px; height: 855px; border-radius: 26px; overflow: hidden;
  background: #fff; box-shadow: 0 30px 90px rgba(0,0,0,.13), 0 6px 20px rgba(0,0,0,.06), 0 0 0 1px rgba(0,0,0,.08); will-change: transform, opacity; }
.cam { position: absolute; left: 0; top: 0; width: 1440px; height: 810px; transform-origin: 0 0; }
.cam img { position: absolute; left: 0; top: 0; width: 1440px; height: 810px; }
.dim { position: absolute; border-radius: 10px; }
.pop { position: absolute; border-radius: 10px; background-repeat: no-repeat; background-size: 1440px 810px; }
.head { position: absolute; left: 0; right: 0; top: 52px; height: 110px; text-align: center; font-weight: 700; font-size: 80px;
  letter-spacing: -0.035em; line-height: 110px; white-space: nowrap; }
.w { display: inline-block; will-change: transform, opacity, filter; }
.big { position: absolute; left: 0; right: 0; text-align: center; font-weight: 750; letter-spacing: -0.045em; white-space: nowrap; }
.sub { position: absolute; left: 0; right: 0; text-align: center; font-weight: 500; font-size: 46px; letter-spacing: -0.02em; color: #6e6e73; }
#lock { position: absolute; inset: 0; filter: brightness(0); }
#lockMark, #lockWord { position: absolute; background: url('../../_kit/brand/DEVIN_LOCKUP_HORIZONTAL_WHITE_TRANSPARENT.png') no-repeat; }
</style></head>
<body><div id="stage"></div>
<script>
// Beat grid of music.mp3 (128 BPM, first beat at 0.045 s; beat 31 is the silent break, beat 32 the drop).
const BPM = 128, B = 60 / BPM, P = 0.045, bt = k => P + k * B;
const DURATION = 33.6;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const outExpo = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
const outCubic = p => 1 - Math.pow(1 - p, 3);
const inOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const inCubic = p => p * p * p;

// Shot coords are the capture's 1440x810 CSS space (images are 3x).
const SCENES = [
  { img: '0016', a: 8,  b: 14, head: 'Trigger on GitHub events', cam: { cx: 875, cy: 360, z: 1.8 }, spot: { x: 850, y: 411, w: 236, h: 34 } },
  { img: '0032', a: 14, b: 20, head: 'Only when a check fails',  cam: { cx: 1000, cy: 262, z: 1.7 }, spot: { x: 668, y: 278, w: 230, h: 32 } },
  { img: '0045', a: 20, b: 25, head: 'Cap spend and runs',       cam: { cx: 1000, cy: 610, z: 1.65 }, spot: { x: 612, y: 560, w: 778, h: 130 } },
  { img: '0052', a: 25, b: 31, head: 'Set it up once',           cam: { cx: 880, cy: 205, z: 1.5 }, spot: { x: 458, y: 194, w: 856, h: 130 } },
  { img: '0060', a: 32, b: 38, head: 'A check fails',            cam: { cx: 560, cy: 610, z: 1.5 }, spot: { x: 113, y: 560, w: 898, h: 148 }, drop: true },
  { img: '0062', a: 38, b: 44, head: 'Devin starts on its own',  cam: { cx: 885, cy: 640, z: 1.42 }, spot: { x: 459, y: 684, w: 852, h: 46 } },
  { img: '0071', a: 44, b: 52, head: 'Finds the bug, pushes a fix', cam: { cx: 590, cy: 410, z: 2.0 }, spot: { x: 398, y: 290, w: 358, h: 222 } },
  { img: '0072', a: 52, b: 60, head: 'Back to green',            cam: { cx: 560, cy: 455, z: 1.45 }, spot: { x: 113, y: 352, w: 898, h: 160 } },
];
const CW = 1520, CH = 855, K = CW / 1440;
const stage = document.getElementById('stage');
const el = (tag, cls, parent = stage, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; parent.appendChild(e); return e; };
const words = (parent, text) => text.split(' ').map((w, i, arr) => { const s = el('span', 'w', parent, w); if (i < arr.length - 1) parent.appendChild(document.createTextNode(' ')); return s; });

for (const s of SCENES) {
  s.t0 = bt(s.a); s.t1 = bt(s.b);
  s.card = el('div', 'card');
  s.camEl = el('div', 'cam', s.card);
  s.imgEl = el('img', '', s.camEl); s.imgEl.src = `../shots/${s.img}.png`;
  const p = 6, r = s.spot;
  s.dimEl = el('div', 'dim', s.camEl);
  Object.assign(s.dimEl.style, { left: r.x - p + 'px', top: r.y - p + 'px', width: r.w + 2 * p + 'px', height: r.h + 2 * p + 'px' });
  s.popEl = el('div', 'pop', s.camEl);
  Object.assign(s.popEl.style, { left: r.x - p + 'px', top: r.y - p + 'px', width: r.w + 2 * p + 'px', height: r.h + 2 * p + 'px',
    backgroundImage: `url(../shots/${s.img}.png)`, backgroundPosition: `${-(r.x - p)}px ${-(r.y - p)}px`, backgroundColor: '#fff' });
  s.headEl = el('div', 'head'); s.words = words(s.headEl, s.head);
}

// Title, recap and end card
const t1 = el('div', 'big'); Object.assign(t1.style, { top: '300px', fontSize: '150px', lineHeight: '170px' });
const t1w = words(t1, 'When CI fails,');
const t2 = el('div', 'big'); Object.assign(t2.style, { top: '480px', fontSize: '150px', lineHeight: '170px' });
const t2w = words(t2, 'Devin fixes it.');
const tsub = el('div', 'sub'); tsub.style.top = '720px'; tsub.textContent = 'Event triggers in Devin Automations';
const rec = el('div', 'big'); Object.assign(rec.style, { top: '455px', fontSize: '150px', lineHeight: '170px' });
const recw = words(rec, 'Nobody had to ask.');
const LW = 1020, LH = LW * 1024 / 2984, LX = (1920 - LW) / 2, LY = 330, SPLIT = 0.33;
const lock = el('div'); lock.id = 'lock';
const mark = el('div', '', lock); mark.id = 'lockMark';
Object.assign(mark.style, { left: LX + 'px', top: LY + 'px', width: LW * SPLIT + 'px', height: LH + 'px', backgroundSize: `${LW}px ${LH}px`, transformOrigin: '60% 50%' });
const word = el('div', '', lock); word.id = 'lockWord';
Object.assign(word.style, { left: LX + LW * SPLIT + 'px', top: LY + 'px', width: LW * (1 - SPLIT) + 'px', height: LH + 'px', backgroundSize: `${LW}px ${LH}px`, backgroundPosition: `${-LW * SPLIT}px 0` });
const cta = el('div', 'sub', stage, 'Try it today at <b style="color:#000;font-weight:650">devin.ai</b>');
Object.assign(cta.style, { top: '720px', fontSize: '52px' });

const show = (e, o, tf = '', blur = 0) => { e.style.opacity = o; e.style.transform = tf; e.style.filter = blur > 0.05 ? `blur(${blur}px)` : 'none'; e.style.visibility = o > 0.001 ? 'visible' : 'hidden'; };

// Word rise: in at tin (staggered), out over [tout, tout+0.25].
function wordsAt(ws, t, tin, tout, stagger = 0.07, slam = false) {
  ws.forEach((w, i) => {
    const pi = seg(t, tin + i * stagger, tin + i * stagger + (slam ? 0.28 : 0.5));
    const po = tout == null ? 0 : seg(t, tout, tout + 0.25);
    const e = outExpo(pi);
    const sc = slam ? lerp(1.35, 1, e) : 1;
    const y = slam ? 0 : lerp(40, 0, e);
    show(w, clamp(pi * 2.2) * (1 - po), `translateY(${y - 26 * inCubic(po)}px) scale(${sc})`, (1 - e) * (slam ? 6 : 12) + po * 6);
  });
}

function sceneAt(s, t) {
  const inA = s.t0, outA = s.t1 - 0.3, outB = s.t1;
  if (t < inA - 0.01 || t > outB) { show(s.card, 0); s.words.forEach(w => show(w, 0)); return; }
  const lt = t - s.t0, dur = s.t1 - s.t0;
  const pin = outExpo(seg(t, inA, inA + 0.6)), pout = inCubic(seg(t, outA, outB));
  let cardTf, cardO;
  if (s.drop) {
    const pd = outExpo(seg(t, inA, inA + 0.45));
    cardTf = `scale(${lerp(1.1, 1, pd) - 0.04 * pout}) translateY(${-80 * pout}px)`;
    cardO = clamp(seg(t, inA, inA + 0.05)) * (1 - pout);
  } else {
    cardTf = `translateY(${lerp(150, 0, pin) - 80 * pout}px) scale(${lerp(0.92, 1, pin) - 0.04 * pout})`;
    cardO = clamp(seg(t, inA, inA + 0.28)) * (1 - pout);
  }
  show(s.card, cardO, cardTf);
  // Camera: ease from full view into the focus, then keep drifting in slowly.
  const c = s.cam;
  let pz = s.drop ? 1 : inOut(seg(lt, 0.3, 1.45));
  let z = lerp(1, c.z, pz) * (1 + 0.035 * seg(lt, 1.45, dur));
  if (s.drop) z *= lerp(1.08, 1, outExpo(seg(lt, 0, 0.6)));
  let cx = lerp(720, c.cx, pz), cy = lerp(405, c.cy, pz);
  const hw = 720 / z, hh = 405 / z;
  cx = clamp(cx, hw, 1440 - hw); cy = clamp(cy, hh, 810 - hh);
  s.camEl.style.transform = `translate(${CW / 2}px, ${CH / 2}px) scale(${K * z}) translate(${-cx}px, ${-cy}px)`;
  // Spotlight: dim everything else, lift the control that matters.
  const ps = outCubic(seg(lt, s.drop ? 0.55 : 1.35, (s.drop ? 0.55 : 1.35) + 0.45));
  s.dimEl.style.boxShadow = `0 0 0 6000px rgba(255,255,255,${0.5 * ps})`;
  const lift = 1 + 0.06 * ps;
  s.popEl.style.opacity = ps;
  s.popEl.style.transform = `scale(${lift})`;
  s.popEl.style.boxShadow = `0 ${18 * ps}px ${50 * ps}px rgba(0,0,0,${0.22 * ps}), 0 0 0 1px rgba(0,0,0,${0.1 * ps})`;
  wordsAt(s.words, t, inA + (s.drop ? 0 : 0.08), s.t1 - 0.3, s.drop ? 0.05 : 0.07, !!s.drop);
}

window.seek = function (t) {
  // Title
  const tOut = bt(7.6);
  wordsAt(t1w, t, bt(0), tOut, B / 2, true);
  wordsAt(t2w, t, bt(2), tOut, B / 2, true);
  const ps = outExpo(seg(t, bt(4.5), bt(4.5) + 0.6)), po = seg(t, tOut, tOut + 0.3);
  show(tsub, ps * (1 - po), `translateY(${lerp(24, 0, ps) - 20 * po}px)`);
  // Product
  for (const s of SCENES) sceneAt(s, t);
  // Recap
  wordsAt(recw, t, bt(60), bt(63.35), B / 2, true);
  // End card
  const e0 = bt(64);
  const pm = outExpo(seg(t, e0, e0 + 0.8));
  show(mark, clamp(seg(t, e0, e0 + 0.2)), `scale(${lerp(0.55, 1, pm)}) rotate(${lerp(-60, 0, pm)}deg)`);
  const pw = outExpo(seg(t, e0 + 0.25, e0 + 1.0));
  word.style.clipPath = `inset(0 ${100 * (1 - pw)}% 0 0)`;
  show(word, pw > 0 ? 1 : 0, `translateX(${lerp(-40, 0, pw)}px)`);
  const pc = outExpo(seg(t, bt(66), bt(66) + 0.6));
  show(cta, pc, `translateY(${lerp(30, 0, pc)}px)`);
  const fade = seg(t, DURATION - 0.3, DURATION);
  stage.style.opacity = 1 - fade;
};
window.DURATION = DURATION;
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode())]).then(() => { seek(0); return true; });
</script></body></html>
