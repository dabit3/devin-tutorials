<!doctype html>
<html><head><meta charset="utf-8"><title>DeepWiki launch</title>
<style>
@font-face { font-family: Inter; src: url(../../_kit/fonts/Inter-VF.ttf) format('truetype'); font-weight: 100 900; }
html, body { margin: 0; background: #f5f5f7; overflow: hidden; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: Inter, -apple-system, Helvetica, Arial, sans-serif; color: #111;
  background: radial-gradient(1400px 900px at 50% 58%, #ffffff 0%, #f6f6f8 55%, #ececef 100%); perspective: 2200px; }
.win { position: absolute; left: 0; top: 0; overflow: hidden; border-radius: 22px; background: #fff; transform-origin: 50% 50%;
  box-shadow: 0 40px 120px rgba(0,0,0,.16), 0 8px 30px rgba(0,0,0,.06), 0 0 0 1px rgba(0,0,0,.08); will-change: transform, opacity, filter; }
.cam { position: absolute; left: 0; top: 0; width: 1440px; height: 810px; transform-origin: 0 0; }
.cam img.shot { position: absolute; left: 0; top: 0; width: 1440px; height: 810px; display: none; }
.dim { position: absolute; left: 0; top: 0; width: 1440px; height: 810px; background: #fafafa; opacity: 0; }
.ring { position: absolute; border-radius: 7px; border: 2.5px solid #111; opacity: 0; box-shadow: 0 0 0 5px rgba(0,0,0,.07); box-sizing: border-box; }
.cursor { position: absolute; left: 0; top: 0; width: 22px; height: 30px; opacity: 0; transform-origin: 0 0; }
.ripple { position: absolute; border-radius: 50%; border: 2px solid rgba(20,20,20,.55); background: rgba(20,20,20,.08); opacity: 0; box-sizing: border-box; }
.wdim { position: absolute; inset: 0; background: #f4f4f6; opacity: 0; }
.head { position: absolute; left: 0; width: 1920px; text-align: center; font-weight: 680; letter-spacing: -0.035em; white-space: nowrap; }
.head span { display: inline-block; margin: 0 .13em; will-change: transform, opacity, filter; }
.card { position: absolute; left: 0; top: 0; overflow: hidden; border-radius: 16px; background: #fff; transform-origin: 0 0;
  box-shadow: 0 30px 90px rgba(0,0,0,.18), 0 6px 20px rgba(0,0,0,.06), 0 0 0 1px rgba(0,0,0,.08); opacity: 0; }
.card img { position: absolute; left: 0; top: 0; }
#intro, #end { position: absolute; inset: 0; }
#end img { position: absolute; }
</style></head>
<body><div id="stage"></div>
<script>
// ---------- timeline helpers ----------
const OFF = 0.12;            // music downbeat offset (s): design time T = t - OFF, beats every 0.5 s (120 BPM)
const DURATION = 34.6;       // video length (s)
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const seg = (T, a, b) => clamp((T - a) / (b - a));
const E = {
  lin: p => p,
  io: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  out: p => 1 - Math.pow(1 - p, 3),
  in: p => p * p * p,
  expo: p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p),
  back: p => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  sine: p => -(Math.cos(Math.PI * p) - 1) / 2,
};
// keys: [[t, value, ease?], ...]; value number or {k: number}; ease applies to the segment ending at that key
function kf(T, keys) {
  if (T <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (T <= keys[i][0]) {
      const [t0, a] = keys[i - 1], [t1, b, e] = keys[i];
      const p = (E[e || 'io'])(seg(T, t0, t1));
      if (typeof a === 'number') return lerp(a, b, p);
      const o = {}; for (const k in a) o[k] = lerp(a[k], b[k], p); return o;
    }
  }
  return keys[keys.length - 1][1];
}
const el = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; parent.appendChild(e); return e; };
const stage = document.getElementById('stage');
const SHOT = n => `../shots/${n}.png`;
const imgs = [];
const CURSOR = `<svg viewBox="0 0 22 30" width="22" height="30"><path d="M2 2 L2 24 L7.6 18.8 L11.4 27.4 L15 25.8 L11.3 17.4 L18.8 17.2 Z" fill="#111" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>`;

// ---------- headline (kinetic words) ----------
function headline(text, { a, b, y = 100, size = 74, color = '#111', weight, stagger = 0.065, parent = stage }) {
  const h = el('div', 'head', parent); h.style.top = (y - size * 0.62) + 'px'; h.style.fontSize = size + 'px'; h.style.color = color;
  if (weight) h.style.fontWeight = weight;
  const words = text.split(' ').map(w => el('span', '', h, w));
  return T => {
    const q = E.in(seg(T, b - 0.32, b));
    h.style.display = (T < a - 0.01 || T > b + 0.01) ? 'none' : 'block';
    words.forEach((w, i) => {
      const p = E.expo(seg(T, a + i * stagger, a + i * stagger + 0.55));
      w.style.opacity = p * (1 - q);
      w.style.transform = `translateY(${(1 - p) * 46 - q * 34}px)`;
      w.style.filter = `blur(${(1 - p) * 12 + q * 8}px)`;
    });
  };
}

// ---------- UI window scenes ----------
const FRAMED = { x: 210, y: 196, w: 1500, h: 844 };
function scene(o) {
  const w = el('div', 'win', stage);
  const cam = el('div', 'cam', w);
  const shots = o.shots.map(([t, n]) => { const i = el('img', 'shot', cam); i.src = SHOT(n); imgs.push(i); return { t, i, n }; });
  const dim = el('div', 'dim', cam);
  const rings = (o.rings || []).map(r => ({ ...r, e: el('div', 'ring', cam) }));
  const ripples = (o.clicks || []).map(t => ({ t, e: el('div', 'ripple', cam) }));
  const cur = el('div', 'cursor', cam, CURSOR);
  const wdim = el('div', 'wdim', w);
  const S = { o, w, cam, camAt(T) { return kf(T, o.cam); } };
  S.camT = (T, R) => {   // css transform of logical image coords inside the window rect R
    const c = kf(T, o.cam), s = R.w / 1440 * c.z;
    let tx = R.w / 2 - c.x * s, ty = R.h / 2 - c.y * s;
    tx = clamp(tx, R.w - 1440 * s, 0); ty = clamp(ty, R.h - 810 * s, 0);
    return { s, tx, ty, z: c.z };
  };
  S.update = T => {
    const vis = T >= o.t0 && T <= o.t1;
    w.style.display = vis ? 'block' : 'none';
    if (!vis) return;
    const R = o.rect ? o.rect(T) : FRAMED;
    // envelope
    let op = 1, sc = 1, blur = 0, dy = 0, rx = 0;
    if (o.enter) ({ op, sc, blur, dy, rx } = { op: 1, sc: 1, blur: 0, dy: 0, rx: 0, ...o.enter(T) });
    else { const p = E.expo(seg(T, o.t0, o.t0 + 0.5)); op = clamp(p * 1.6); sc = lerp(1.07, 1, p); blur = (1 - p) * 14; }
    if (o.exit) { const x = o.exit(T); op *= x.op ?? 1; sc *= x.sc ?? 1; blur += x.blur ?? 0; dy += x.dy ?? 0; }
    else { const q = E.in(seg(T, o.t1 - 0.36, o.t1)); op *= 1 - q; sc *= lerp(1, 0.95, q); blur += q * 10; }
    w.style.left = R.x + 'px'; w.style.top = R.y + 'px'; w.style.width = R.w + 'px'; w.style.height = R.h + 'px';
    w.style.opacity = op; w.style.filter = blur > 0.05 ? `blur(${blur}px)` : 'none';
    w.style.transform = `translateY(${dy}px) rotateX(${rx}deg) scale(${sc})`;
    const C = S.camT(T, R);
    cam.style.transform = `translate(${C.tx}px, ${C.ty}px) scale(${C.s})`;
    // shots (with optional short crossfade)
    let cur_i = 0; shots.forEach((s, i) => { if (T >= s.t) cur_i = i; });
    shots.forEach((s, i) => {
      const xf = o.xfade || 0;
      let a = 0;
      if (i === cur_i) a = 1;
      else if (i === cur_i - 1 && xf && T < shots[cur_i].t + xf) a = 1;
      s.i.style.display = a ? 'block' : 'none';
      s.i.style.zIndex = i === cur_i ? 2 : 1;
      s.i.style.opacity = (i === cur_i && xf && i > 0) ? seg(T, s.t, s.t + xf) : 1;
    });
    // rings + dim with holes
    let dimA = 0; const holes = [];
    rings.forEach(r => {
      const a = E.out(seg(T, r.a, r.a + 0.25)) * (1 - E.in(seg(T, r.b - 0.25, r.b)));
      const pop = E.back(seg(T, r.a, r.a + 0.4));
      const [x, y, rw, rh] = r.r, pad = 5;
      r.e.style.opacity = a; r.e.style.display = a > 0.002 ? 'block' : 'none';
      const bw = 2.6 / C.z * (R.w / 1440 > 1 ? 1 : 1.2);
      r.e.style.borderWidth = bw + 'px';
      const g = lerp(1.25, 1, pop);
      const cx = x + rw / 2, cy = y + rh / 2, W2 = (rw + pad * 2) * g, H2 = (rh + pad * 2) * g;
      r.e.style.left = (cx - W2 / 2) + 'px'; r.e.style.top = (cy - H2 / 2) + 'px'; r.e.style.width = W2 + 'px'; r.e.style.height = H2 + 'px';
      if (a > 0.002) { holes.push([x - pad, y - pad, rw + pad * 2, rh + pad * 2]); if (r.dim !== false) dimA = Math.max(dimA, a); }
    });
    dim.style.opacity = dimA * (o.dimLevel ?? 0.42);
    if (holes.length) dim.style.clipPath = `path(evenodd, "M0 0 H1440 V810 H0 Z ${holes.map(([x, y, w, h]) => `M${x} ${y} H${x + w} V${y + h} H${x} Z`).join(' ')}")`;
    else dim.style.clipPath = 'none';
    // cursor
    if (o.cursor) {
      const p = kf(T, o.cursor.path);
      const ca = seg(T, o.cursor.a, o.cursor.a + 0.25) * (1 - seg(T, o.cursor.b - 0.25, o.cursor.b));
      let press = 1; (o.clicks || []).forEach(t => { const k = seg(T, t - 0.08, t + 0.16); if (k > 0 && k < 1) press = Math.min(press, 1 - 0.18 * Math.sin(Math.PI * k)); });
      const cs = 1.15 / C.z;
      cur.style.opacity = ca; cur.style.transform = `translate(${p.x - 2 * cs}px, ${p.y - 2 * cs}px) scale(${cs * press})`;
    }
    ripples.forEach(r => {
      const k = seg(T, r.t, r.t + 0.5), p = o.cursor ? kf(r.t, o.cursor.path) : { x: 0, y: 0 };
      const rad = lerp(6, 34, E.out(k)) / C.z * 1.2;
      r.e.style.display = k > 0 && k < 1 ? 'block' : 'none';
      r.e.style.opacity = 1 - k; r.e.style.left = (p.x - rad) + 'px'; r.e.style.top = (p.y - rad) + 'px'; r.e.style.width = r.e.style.height = rad * 2 + 'px';
      r.e.style.borderWidth = 2 / C.z + 'px';
    });
    wdim.style.opacity = o.winDim ? o.winDim(T) : 0;
    S.R = R; S.C = C; S.op = op;
  };
  return S;
}

// floating card cropped from a real screenshot; flies from its spot in the window to a target spot
function card(S, o) {
  const c = el('div', 'card', stage); const i = el('img', '', c); i.src = SHOT(o.shot); imgs.push(i);
  const [x, y, w, h] = o.crop; const ring = o.ring ? el('div', 'ring', c) : null;
  return T => {
    const vis = T >= o.a && T <= o.b; c.style.display = vis ? 'block' : 'none'; if (!vis) return;
    const p = E.expo(seg(T, o.a, o.a + 0.8)), q = E.in(seg(T, o.b - 0.45, o.b));
    // source rect in stage coords (from the window camera at time T)
    const R = S.R || FRAMED, C = S.camT(T, R);
    const sx = R.x + C.tx + x * C.s, sy = R.y + C.ty + y * C.s, sk = C.s;
    const k = lerp(sk, o.k, p), X = lerp(sx, o.x, p), Y = lerp(sy, o.y, p);
    c.style.width = w * o.k + 'px'; c.style.height = h * o.k + 'px';
    i.style.width = 1440 * o.k + 'px'; i.style.height = 810 * o.k + 'px'; i.style.left = -x * o.k + 'px'; i.style.top = -y * o.k + 'px';
    const sc = k / o.k * lerp(1, 0.9, q);
    c.style.transform = `translate(${X + (w * o.k) * (1 - lerp(1, 0.9, q)) / 2}px, ${Y + q * 30}px) scale(${sc})`;
    c.style.opacity = clamp(p * 3) * (1 - q);
    c.style.borderRadius = lerp(2, 16, p) / sc + 'px';
    if (ring) {
      const [rx, ry, rw, rh] = o.ring.r, a = E.out(seg(T, o.ring.a, o.ring.a + 0.25)) * (1 - q), pop = E.back(seg(T, o.ring.a, o.ring.a + 0.4)), g = lerp(1.25, 1, pop), pad = 6;
      const cx = (rx - x + rw / 2) * o.k, cy = (ry - y + rh / 2) * o.k, W2 = (rw * o.k + pad * 2) * g, H2 = (rh * o.k + pad * 2) * g;
      ring.style.opacity = a; ring.style.left = cx - W2 / 2 + 'px'; ring.style.top = cy - H2 / 2 + 'px'; ring.style.width = W2 + 'px'; ring.style.height = H2 + 'px';
      ring.style.borderColor = '#111'; ring.style.borderWidth = '3px'; ring.style.boxShadow = '0 0 0 4px rgba(0,0,0,.08)';
    }
  };
}

const updaters = [];

// ---------- 1. intro ----------
const intro = el('div', '', stage); intro.id = 'intro';
updaters.push(headline('Every repo.', { a: 0.0, b: 2.15, y: 470, size: 150, parent: intro, stagger: 0.12 }));
updaters.push(headline('Explained.', { a: 1.0, b: 2.15, y: 640, size: 150, parent: intro, color: '#86868b' }));
const dw = el('div', 'head', intro, 'DeepWiki'); dw.style.fontSize = '230px'; dw.style.top = '345px'; dw.style.fontWeight = 720;
updaters.push(headline('Your codebase, documented by Devin', { a: 2.5, b: 4.0, y: 690, size: 54, color: '#6e6e73', weight: 520, parent: intro, stagger: 0.05 }));
updaters.push(T => {
  const p = E.expo(seg(T, 2.0, 2.8)), q = E.in(seg(T, 3.55, 4.0));
  dw.style.display = T >= 2.0 && T <= 4.0 ? 'block' : 'none';
  dw.style.opacity = clamp(p * 2) * (1 - q);
  dw.style.transform = `translateY(${-q * 60}px) scale(${lerp(1.22, 1, p) * lerp(1, 0.94, q)})`;
  dw.style.filter = `blur(${(1 - p) * 22 + q * 10}px)`;
  dw.style.letterSpacing = lerp(0.02, -0.045, p) + 'em';
});

// ---------- 2. wiki list ----------
const S1 = scene({
  t0: 3.65, t1: 8.05, shots: [[0, '0002']],
  cam: [[3.65, { x: 720, y: 405, z: 1 }], [5.3, { x: 720, y: 405, z: 1 }], [6.4, { x: 650, y: 420, z: 1.55 }], [7.45, { x: 640, y: 425, z: 1.62 }], [8.05, { x: 612, y: 434, z: 3.4 }, 'in']],
  enter: T => { const p = E.expo(seg(T, 3.65, 4.6)); return { op: clamp(p * 2.2), dy: (1 - p) * 520, rx: (1 - p) * 30, sc: lerp(0.86, 1, p), blur: (1 - p) * 6 }; },
  exit: T => { const q = seg(T, 7.7, 8.05); return { op: 1 - E.in(q), blur: E.in(q) * 8 }; },
  cursor: { a: 4.7, b: 8.0, path: [[4.7, { x: 1250, y: 760 }], [6.65, { x: 612, y: 440 }, 'io']] },
  clicks: [6.95],
  rings: [{ a: 6.15, b: 7.75, r: [358.5, 392, 508, 84] }],
});
updaters.push(S1.update);
updaters.push(headline('A wiki for every repo', { a: 3.95, b: 7.75 }));

// ---------- 3. overview + sources ----------
const S2 = scene({
  t0: 7.72, t1: 12.1, shots: [[0, '0004'], [9.8, '0006']],
  cam: [[7.72, { x: 760, y: 330, z: 1.12 }], [8.9, { x: 760, y: 230, z: 1.55 }], [9.85, { x: 760, y: 230, z: 1.55 }], [11.0, { x: 760, y: 200, z: 1.8 }], [12.1, { x: 760, y: 215, z: 1.86 }]],
  enter: T => { const p = E.expo(seg(T, 7.72, 8.2)); return { op: clamp(p * 1.8), sc: lerp(1.14, 1, p), blur: (1 - p) * 12 }; },
  cursor: { a: 8.2, b: 10.6, path: [[8.2, { x: 980, y: 480 }], [9.5, { x: 600, y: 140 }, 'io'], [10.6, { x: 760, y: 330 }]] },
  clicks: [9.72],
  rings: [{ a: 10.05, b: 11.85, r: [511, 120, 671, 71] }],
});
updaters.push(S2.update);
updaters.push(headline('Built from your code', { a: 7.95, b: 11.85 }));

// ---------- 4. architecture diagram ----------
const S3 = scene({
  t0: 11.78, t1: 16.1, shots: [[0, '0011']],
  cam: [[11.78, { x: 780, y: 395, z: 1.1 }], [12.4, { x: 430, y: 400, z: 1.85 }, 'out'], [13.9, { x: 1110, y: 400, z: 1.85 }, 'sine'], [14.7, { x: 780, y: 400, z: 1.1 }], [16.1, { x: 780, y: 410, z: 1.18 }, 'lin']],
});
updaters.push(S3.update);
updaters.push(headline('Architecture, diagrammed', { a: 12.0, b: 15.85 }));

// ---------- 5. citations ----------
const S4 = scene({
  t0: 15.78, t1: 20.1, shots: [[0, '0014'], [17.5, '0020']], xfade: 0.18,
  cam: [[15.78, { x: 860, y: 290, z: 1.38 }], [17.45, { x: 860, y: 320, z: 1.5 }, 'lin'], [17.5, { x: 880, y: 300, z: 1.58 }, 'lin'], [20.1, { x: 880, y: 320, z: 1.7 }, 'lin']],
  rings: [
    { a: 16.45, b: 17.45, r: [544, 345, 227, 18] },
    { a: 18.0, b: 19.9, r: [825, 177, 234, 19] },
    { a: 18.5, b: 19.9, r: [943, 319, 221, 18] },
    { a: 19.0, b: 19.9, r: [604, 358, 234, 19] },
    { a: 19.5, b: 19.9, r: [544, 427, 235, 18] },
  ], dimLevel: 0.3,
});
updaters.push(S4.update);
updaters.push(headline('Every page cites the code', { a: 16.0, b: 19.85 }));

// ---------- 6. ask ----------
const typing = []; for (let i = 26; i <= 40; i++) typing.push([20.6 + (i - 26) * 0.1, String(i).padStart(4, '0')]);
const S5 = scene({
  t0: 19.78, t1: 23.72, shots: [[0, '0024'], [20.42, '0025'], ...typing, [22.1, '0041']],
  cam: [[19.78, { x: 850, y: 560, z: 1.15 }], [20.55, { x: 850, y: 690, z: 1.75 }, 'out'], [22.6, { x: 900, y: 690, z: 1.8 }, 'lin'], [23.72, { x: 1000, y: 700, z: 2.1 }, 'in']],
  cursor: { a: 19.85, b: 23.5, path: [[19.85, { x: 846, y: 661 }], [22.2, { x: 846, y: 661 }], [22.75, { x: 1197, y: 728 }, 'io']] },
  clicks: [20.35, 22.95],
});
updaters.push(S5.update);
updaters.push(headline('Ask anything', { a: 20.0, b: 23.45 }));

// ---------- 7. answer ----------
const S6 = scene({
  t0: 23.42, t1: 30.0,
  shots: [[0, '0046'], [24.3, '0052'], [24.75, '0054'], [25.2, '0056'], [25.6, '0059'], [26.0, '0061']],
  cam: [[23.42, { x: 720, y: 405, z: 1 }], [26.1, { x: 760, y: 405, z: 1.06 }, 'lin'], [30, { x: 760, y: 405, z: 1.1 }, 'lin']],
  winDim: T => 0.62 * E.out(seg(T, 26.3, 26.9)),
  exit: T => { const q = E.in(seg(T, 29.4, 30.0)); return { op: 1 - q, sc: lerp(1, 0.86, q), blur: q * 10 }; },
});
updaters.push(S6.update);
updaters.push(headline('Answers point to the code', { a: 23.62, b: 29.55 }));
const CARD_A = [328, 288, 410, 66], CARD_B = [776, 186, 470, 142];
updaters.push(card(S6, { shot: '0061', crop: CARD_A, a: 26.35, b: 29.85, k: 2.3, x: 960 - CARD_A[2] * 2.3 / 2, y: 262, ring: { a: 27.3, r: [350, 330, 108, 21] } }));
updaters.push(card(S6, { shot: '0061', crop: CARD_B, a: 26.55, b: 29.85, k: 1.9, x: 960 - CARD_B[2] * 1.9 / 2, y: 445 }));

// ---------- 8. end card ----------
const end = el('div', '', stage); end.id = 'end';
const LW = 820, LH = LW * 1024 / 2984, LX = 960 - LW / 2, LY = 400 - LH / 2, SPLIT = 0.30;
const mark = el('img', '', end); mark.src = 'devin-lockup-dark.png'; imgs.push(mark);
const word = el('img', '', end); word.src = mark.src; imgs.push(word);
[mark, word].forEach(i => { i.style.left = LX + 'px'; i.style.top = LY + 'px'; i.style.width = LW + 'px'; i.style.height = LH + 'px'; });
updaters.push(headline('Try DeepWiki today at devin.ai', { a: 30.75, b: 34.6, y: 640, size: 60, color: '#1d1d1f', weight: 560, parent: end, stagger: 0.06 }));
updaters.push(T => {
  end.style.display = T >= 29.8 ? 'block' : 'none';
  const p = E.back(seg(T, 30.0, 30.7)), pa = seg(T, 30.0, 30.2), w = E.expo(seg(T, 30.3, 31.1));
  // mark pops in at the center of the lockup, then slides left as the wordmark wipes in
  const markCx = LX + LW * 0.17, shift = (960 - markCx) * (1 - w);
  mark.style.clipPath = `inset(0 ${(1 - SPLIT) * 100}% 0 0)`;
  mark.style.transformOrigin = `${LW * 0.17}px 50%`;
  mark.style.opacity = pa;
  mark.style.transform = `translateX(${shift}px) scale(${lerp(0.3, 1, p)}) rotate(${lerp(-40, 0, E.out(seg(T, 30.0, 30.7)))}deg)`;
  mark.style.filter = `blur(${(1 - pa) * 10}px)`;
  word.style.clipPath = `inset(0 ${(1 - w) * (1 - SPLIT) * 100}% 0 ${SPLIT * 100}%)`;
  word.style.transform = `translateX(${shift}px)`;
  word.style.opacity = clamp(w * 1.5);
  const f = E.in(seg(T, 34.15, 34.48)); end.style.opacity = 1 - f;
});

// ---------- API ----------
window.DURATION = DURATION; window.OFF = OFF;
window.seek = t => { const T = t - OFF; for (const u of updaters) u(T); };
window.cues = () => ({   // audio cues in video time (s)

  impact: [30.0 + OFF], duration: DURATION,
});
window.ready = Promise.all([document.fonts.load('700 100px Inter'), ...imgs.map(i => i.decode().catch(e => { throw new Error('img ' + i.src); }))]);
seek(Number(new URLSearchParams(location.search).get('t') || 0));
