<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../_kit/tools/node_modules/@xterm/xterm/css/xterm.css">
<style>
@font-face{font-family:JBM;src:url(../../_kit/fonts/JetBrainsMono-VF.ttf);font-weight:100 800}
html,body{margin:0;width:1440px;height:810px;background:#fbfbfb;overflow:hidden}
#bar{height:44px;display:flex;align-items:center;justify-content:center;position:relative;background:#f0f0f2;border-bottom:1px solid #e2e2e6;font:500 15px -apple-system,BlinkMacSystemFont,sans-serif;color:#6b6b73}
#dots{position:absolute;left:18px;display:flex;gap:9px}#dots i{width:13px;height:13px;border-radius:50%;display:block}
#t{position:absolute;left:30px;top:66px;right:30px;bottom:20px}
.xterm .xterm-viewport{background:transparent!important;overflow:hidden!important}
</style></head><body>
<div id="bar"><div id="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div><span id="title">orbit — devin</span></div>
<div id="t"></div>
<script src="../../_kit/tools/node_modules/@xterm/xterm/lib/xterm.js"></script>
<script>
const FS = Number(new URLSearchParams(location.search).get('fs') || 21);
const term = new Terminal({ fontFamily: 'JBM', fontSize: FS, lineHeight: 1.08, fontWeight: 400, fontWeightBold: 700, cursorBlink: false, cursorStyle: 'block', allowProposedApi: true, scrollback: 0, drawBoldTextInBrightColors: false,
  theme: { background: '#fbfbfb', foreground: '#1d1d1f', cursor: '#1d1d1f', cursorAccent: '#fbfbfb', selectionBackground: '#d0d7e2',
    black: '#1d1d1f', red: '#c4302b', green: '#1a7f37', yellow: '#9a6700', blue: '#0a66d8', magenta: '#8250df', cyan: '#0f7b8a', white: '#6e6e76',
    brightBlack: '#8a8a92', brightRed: '#d1242f', brightGreen: '#1f883d', brightYellow: '#9a6700', brightBlue: '#0969da', brightMagenta: '#8250df', brightCyan: '#1b7c83', brightWhite: '#1d1d1f' } });
window.ready = document.fonts.load(`${FS}px JBM`).then(() => {
  term.open(document.getElementById('t'));
  const el = document.getElementById('t'), core = term._core, cell = core._renderService.dimensions.css.cell;
  const cols = Math.floor(el.clientWidth / cell.width), rows = Math.floor(el.clientHeight / cell.height);
  term.resize(cols, rows); return { cols, rows };
});
window.render = (text, cx, cy, show, title) => new Promise(r => {
  if (title) document.getElementById('title').textContent = title;
  const lines = text.replace(/\n$/, '').split('\n');
  let s = '\x1b[0m\x1b[2J\x1b[H' + (show ? '\x1b[?25h' : '\x1b[?25l');
  lines.slice(0, term.rows).forEach((l, i) => { s += `\x1b[${i + 1};1H` + l + '\x1b[0m'; });
  s += `\x1b[${cy + 1};${cx + 1}H`;
  term.write(s, () => requestAnimationFrame(() => requestAnimationFrame(r)));
});
</script></body></html>
