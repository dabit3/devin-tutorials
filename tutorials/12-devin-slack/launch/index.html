<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Inter; src: url(../../_kit/fonts/Inter-VF.ttf) format('truetype'); font-weight: 100 900; }
html, body { margin: 0; background: #fff; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; font-family: Inter, -apple-system, Helvetica, Arial, sans-serif; color: #0a0a0a;
  background: radial-gradient(ellipse 80% 70% at 50% 45%, #ffffff 0%, #f6f6f7 55%, #ececee 100%); }
.abs { position: absolute; left: 0; top: 0; }
.card { position: absolute; overflow: hidden; border-radius: 22px; background: #fff; will-change: transform;
  box-shadow: 0 30px 90px rgba(0,0,0,.16), 0 6px 20px rgba(0,0,0,.06), 0 0 0 1px rgba(0,0,0,.08); }
.layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.layer img { position: absolute; left: 0; top: 0; transform-origin: 0 0; display: block; }
.spot { position: absolute; border-radius: 12px; border: 3px solid #0a0a0a; pointer-events: none;
  box-shadow: 0 0 0 4000px rgba(255,255,255,.45), 0 8px 24px rgba(0,0,0,.18); }
.dim { position: absolute; inset: 0; background: #fff; }
.head { position: absolute; font-weight: 680; letter-spacing: -0.025em; line-height: 1.04; white-space: nowrap; }
.head .w { display: inline-block; will-change: transform; }
.sub { position: absolute; font-weight: 450; color: #6e6e73; letter-spacing: -0.01em; white-space: nowrap; }
.lockup { position: absolute; overflow: visible; }
.lockup img { width: 100%; display: block; }
</style></head>
<body><div id="stage"></div>
<script src="timeline.js"></script>
</body></html>
