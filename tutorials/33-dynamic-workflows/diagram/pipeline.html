<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(../../_kit/fonts/Inter-VF.ttf)}
html,body{margin:0;width:1440px;height:810px;font-family:Inter;color:#111;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 40%,#fff 0,#fafafa 60%,#f3f3f3 100%)}
svg{position:absolute;inset:0}
.n{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #e4e4e4;border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);white-space:nowrap}
.n img{display:block}
.top{padding:13px 20px;font-size:21px;font-weight:600}.top img{width:26px}
.code{padding:11px 18px;font:500 17px ui-monospace,Menlo,monospace;color:#333}
.ag{padding:9px 14px;font-size:15px;font-weight:550}.ag img{width:18px}.ag i{font-style:normal;font-weight:550;color:#2563eb}.ag.dim{opacity:.55}.ag.dim i{color:#888}
.lab{position:absolute;left:70px;transform:translateY(-50%);font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#9a9a9a}
.cards{position:absolute;left:0;right:0;top:325px;display:flex;justify-content:center;gap:28px}
.card{width:330px;background:#fff;border:1px solid #e4e4e4;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);padding:24px 26px}
.card b{display:block;font-size:20px;font-weight:600;margin-bottom:10px}.card span{font-size:16px;line-height:1.45;color:#555}
.kick{position:absolute;top:270px;width:100%;text-align:center;font-size:15px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#9a9a9a}
</style></head><body><svg id=s width=1440 height=810></svg><div id=root></div>
<script>
// Data is filled in from the real run (see ../voice-script.md).
const Q=new URLSearchParams(location.search), L=+Q.get('level')||1;
const D=window.DATA||{units:['AddCardForm','CardModal','CommandMenu','Dialog','Sidebar'],stages:['audit','fix + PR','verify'],
 labels:[null,['PR #29','PR #32','PR #31','clean, no PR','PR #30'],['passed','passed','passed','baseline passed','passed']],roll:'Roll-up: 4 PRs, follow-ups for manual attention'};
const root=document.getElementById('root'),s=document.getElementById('s');
if(Q.get('ideas')){root.innerHTML=`<div class=kick>More ideas for workflows</div><div class=cards>
<div class=card><b>Migrations</b><span>One agent per job on its own branch, running its tests, then a roll-up of what needs attention.</span></div>
<div class=card><b>Research and evaluation</b><span>One agent scores each option against your requirements, then a final agent compares and recommends one.</span></div>
<div class=card><b>Loop until green</b><span>Run the suite, fix what failed, and repeat until it passes three runs in a row or a round fixes nothing new.</span></div></div>`;}
else{
const X=D.units.map((_,i)=>720+(i-(D.units.length-1)/2)*250), Y=[95,190,320,430,540,650];
const add=(cls,x,y,html)=>{const d=document.createElement('div');d.className='n '+cls;d.style.left=x+'px';d.style.top=y+'px';d.innerHTML=html;root.appendChild(d);};
const line=(x1,y1,x2,y2)=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');const m=(y1+y2)/2;p.setAttribute('d',`M${x1} ${y1} C ${x1} ${m}, ${x2} ${m}, ${x2} ${y2}`);p.setAttribute('fill','none');p.setAttribute('stroke','#cfcfcf');p.setAttribute('stroke-width',1.5);s.appendChild(p);};
const av='<img src="../../_kit/brand/DEVIN_AVATAR_SQUARE_BLACK_NO_BG.png">';
add('top',720,Y[0],av+'<span>Devin</span>');
if(L>=1){line(720,Y[0]+28,720,Y[1]-22);add('code',720,Y[1],'workflow.py');}
D.stages.forEach((st,k)=>{if(L<k+2)return;const y=Y[k+2];
 const lab=document.createElement('div');lab.className='lab';lab.style.top=y+'px';lab.textContent=st;root.appendChild(lab);
 X.forEach((x,i)=>{line(k?x:720,k?Y[k+1]+20:Y[1]+22,x,y-20);const lb=D.labels&&D.labels[k]&&D.labels[k][i];add('ag'+(lb&&/no PR/.test(lb)?' dim':''),x,y,av+(lb?'<i>'+lb+'</i>':'<span>'+D.units[i]+'</span>'));});});
if(L>=D.stages.length+2){const y=Y[D.stages.length+2];X.forEach(x=>line(x,Y[D.stages.length+1]+20,720,y-22));add('top',720,y,'<span>'+D.roll+'</span>');}
}
</script></body></html>
