<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(../../_kit/fonts/Inter-VF.ttf)}
html,body{margin:0;width:1440px;height:810px;font-family:Inter;color:#111;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 40%,#fff 0,#fafafa 60%,#f3f3f3 100%)}
h1{position:absolute;top:268px;width:100%;text-align:center;margin:0;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#9a9a9a;font-weight:550}
.g{position:absolute;left:50%;top:450px;transform:translate(-50%,-50%);display:grid;grid-template-columns:repeat(2,440px);gap:22px}
.k{background:#fff;border:1px solid #e4e4e4;border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);padding:22px 24px;display:flex;flex-direction:column;gap:8px}
.k .t{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:600}.k img{width:20px}
.k .d{font-size:15px;color:#666;line-height:1.4}
.hide{visibility:hidden}
</style></head><body><h1>More ideas to try</h1><div class=g id=g></div>
<script>
const L = +new URLSearchParams(location.search).get('level') || 4;
const AV = '<img src="../../_kit/brand/DEVIN_AVATAR_SQUARE_BLACK_NO_BG.png">';
const I = [
  ['Evaluate libraries', 'Prototype the same feature with each candidate before you adopt one.'],
  ['Explore UI designs', 'Build several versions of a screen, each in its own PR.'],
  ['Reproduce a bug across versions', 'One Devin per release narrows down where it started.'],
  ['Plan a migration', 'Try a few migration paths on real code and compare the diffs.'],
];
document.getElementById('g').innerHTML = I.map(([t, d], i) => `<div class="k${i < L ? '' : ' hide'}"><div class=t>${AV}<span>${t}</span></div><div class=d>${d}</div></div>`).join('');
</script></body></html>
