<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Inter'; src: url('../../_kit/fonts/Inter-VF.ttf') format('truetype'); font-weight: 100 900; }
@font-face { font-family: 'JBM'; src: url('../../_kit/fonts/JetBrainsMono-VF.ttf') format('truetype'); font-weight: 100 900; }
html, body { margin: 0; width: 3840px; height: 2160px; overflow: hidden; background: #f5f5f7; }
* { box-sizing: border-box; }
#root { position: absolute; inset: 0; overflow: hidden; font-family: 'Inter', sans-serif; color: #1d1d1f;
  background: radial-gradient(ellipse 70% 60% at 50% 55%, #ffffff 0%, #f5f5f7 60%, #e8e8ed 100%); }
#bgblur { position: absolute; inset: -5%; background-size: cover; background-position: center; opacity: 0; }
#stage { position: absolute; inset: 0; perspective: 5000px; }
.card { position: absolute; left: 0; top: 0; border-radius: 30px; overflow: hidden; background: #fafafa;
  box-shadow: 0 40px 120px rgba(0,0,0,.13), 0 8px 30px rgba(0,0,0,.06), 0 0 0 2px rgba(0,0,0,.07); transform-origin: 50% 50%; }
.cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.cam img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; }
.spot { position: absolute; border-radius: 14px; opacity: 0; box-shadow: 0 0 0 5px rgba(17,17,17,.9), 0 0 0 9000px rgba(0,0,0,.05); }
.hl { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; font-weight: 650; letter-spacing: -0.028em; }
.hl span { display: inline-block; will-change: transform; }
.mono { font-family: 'JBM', monospace; font-weight: 600; letter-spacing: -0.02em; }
#end { position: absolute; inset: 0; }
#lockWrap { position: absolute; left: 50%; top: 940px; width: 1500px; height: 515px; margin-left: -750px; margin-top: -257px; }
#lock { position: absolute; inset: 0; filter: brightness(0.11); background: url('../../_kit/brand/DEVIN_LOCKUP_HORIZONTAL_WHITE_TRANSPARENT.png') center/contain no-repeat; }
#cta { position: absolute; left: 0; right: 0; top: 1390px; text-align: center; font-size: 104px; font-weight: 560; letter-spacing: -0.02em; color: #6e6e73; opacity: 0; }
#cta b { color: #1d1d1f; font-weight: 650; }
</style></head>
<body><div id="root"><div id="bgblur"></div><div id="stage"></div><div id="texts"></div>
<div id="end"><div id="lockWrap"><div id="lock"></div></div><div id="cta">Try it today at <b>devin.ai</b></div></div></div>
<script src="timeline.js"></script>
</body></html>
