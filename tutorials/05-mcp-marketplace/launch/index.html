<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MCP Servers & Marketplace launch</title>
<style>
@font-face { font-family: InterV; src: url(../../_kit/fonts/Inter-VF.ttf) format('truetype'); font-weight: 100 900; }
html, body { margin: 0; background: #f0f0f2; overflow: hidden; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #f0f0f2; font-family: InterV, sans-serif; color: #111113; -webkit-font-smoothing: antialiased; perspective: 2400px; }
#glow { position: absolute; inset: 0; background: radial-gradient(1200px 700px at 50% 62%, rgba(255,255,255,0.95), rgba(255,255,255,0) 72%); }
.win { position: absolute; left: 240px; top: 205px; width: 1440px; height: 810px; border-radius: 22px; overflow: hidden; background: #fbfbfb; transform-origin: 50% 50%;
       box-shadow: 0 40px 110px rgba(0,0,0,0.16), 0 8px 24px rgba(0,0,0,0.06), 0 0 0 1px rgba(0,0,0,0.08); }
.cam { position: absolute; left: 0; top: 0; width: 1440px; height: 810px; transform-origin: 0 0; }
.cam img { position: absolute; left: 0; top: 0; width: 1440px; height: 810px; }
.ring { position: absolute; border: 3px solid #3d7bff; border-radius: 12px; box-shadow: 0 0 0 7px rgba(61,123,255,0.16); box-sizing: border-box; transform-origin: 50% 50%; }
.dim { position: absolute; inset: 0; background: #111113; opacity: 0; }
.pop { position: absolute; left: 0; top: 0; background-repeat: no-repeat; border-radius: 10px; transform-origin: 0 0; background-color: #fbfbfb; }
.card { position: absolute; left: 0; top: 0; background-repeat: no-repeat; border-radius: 16px; background-color: #fbfbfb; box-shadow: 0 18px 48px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.07); }
.head { position: absolute; left: 0; width: 1920px; text-align: center; font-weight: 640; letter-spacing: -0.035em; white-space: nowrap; transform-origin: 50% 0; }
.w { display: inline-block; }
.lock { position: absolute; background: url(../../_kit/brand/DEVIN_LOCKUP_HORIZONTAL_WHITE_TRANSPARENT.png) no-repeat; background-size: 100% 100%; filter: brightness(0); }
</style>
</head>
<body>
<div id="stage"><div id="glow"></div></div>
<script src="timeline.js"></script>
</body>
</html>
