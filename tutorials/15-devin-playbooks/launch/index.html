<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Inter'; src: url('../../_kit/fonts/Inter-VF.ttf') format('truetype'); font-weight: 100 900; }
html, body { margin: 0; background: #fff; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 3840px; height: 2160px; overflow: hidden; font-family: 'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif; color: #1d1d1f;
  background: radial-gradient(120% 90% at 50% 0%, #ffffff 0%, #f6f6f7 55%, #ececee 100%); }
.layer { position: absolute; left: 0; top: 0; width: 3840px; height: 2160px; pointer-events: none; }
.line { position: absolute; left: 0; width: 3840px; text-align: center; white-space: nowrap; font-weight: 650; letter-spacing: -0.035em; }
.word { display: inline-block; will-change: transform, opacity, filter; }
.card { position: absolute; overflow: hidden; border-radius: 40px; background: #fff;
  box-shadow: 0 60px 160px rgba(0,0,0,.16), 0 12px 40px rgba(0,0,0,.08), 0 0 0 2px rgba(0,0,0,.07); transform-origin: 50% 50%; }
.card img { position: absolute; left: 0; top: 0; display: none; }
.spot { position: absolute; border-radius: 18px; box-shadow: 0 0 0 9999px rgba(10,10,12,.42); border: 5px solid rgba(255,255,255,.95); outline: 2px solid rgba(0,0,0,.25); opacity: 0; }
.pulse { position: absolute; border-radius: 50%; border: 8px solid rgba(20,20,22,.55); opacity: 0; }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
#logo { position: absolute; left: 50%; top: 50%; }
</style></head>
<body><div id="stage"></div>
<script src="timeline.js"></script>
</body></html>
