<!doctype html>
<html><head><meta charset="utf-8">
<title>Introducing Devin — launch</title>
<style>
@font-face { font-family: Inter; src: url(../../_kit/fonts/Inter-VF.ttf) format('truetype'); font-weight: 100 900; }
html, body { margin: 0; background: #f5f5f7; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #f5f5f7;
  font-family: Inter, sans-serif; color: #1d1d1f; -webkit-font-smoothing: antialiased; }
#glow { position: absolute; inset: -200px; background: radial-gradient(ellipse 60% 55% at 50% 50%, #ffffff 0%, #f7f7f8 55%, #ececee 100%); }
.card { position: absolute; overflow: hidden; border-radius: 22px; background: #fff;
  box-shadow: 0 30px 90px rgba(0,0,0,.13), 0 6px 20px rgba(0,0,0,.06), 0 0 0 1px rgba(0,0,0,.08); will-change: transform, filter, opacity; }
.cam { position: absolute; left: 0; top: 0; width: 1440px; height: 810px; transform-origin: 0 0; }
.cam img { position: absolute; left: 0; top: 0; width: 1440px; height: 810px; display: none; }
.spot { position: absolute; z-index: 5; border-radius: 10px; box-shadow: 0 0 0 4000px rgba(0,0,0,.42), 0 0 0 2.5px #fff, 0 0 24px 6px rgba(255,255,255,.55); opacity: 0; }
.cursor { position: absolute; z-index: 7; width: 22px; height: 33px; left: 0; top: 0; opacity: 0; transform-origin: 0 0; }
.ripple { position: absolute; z-index: 6; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 3px solid #111; opacity: 0; }
.txt { position: absolute; white-space: nowrap; }
.w { display: inline-block; will-change: transform, opacity, filter; }
.h1 { font-weight: 700; letter-spacing: -0.035em; line-height: 1.04; }
.sub { font-weight: 500; letter-spacing: -0.015em; color: #6e6e73; }
.mark { position: absolute; background: url(../../_kit/brand/DEVIN_LOCKUP_HORIZONTAL_WHITE_TRANSPARENT.png) no-repeat; background-size: 100% 100%; filter: brightness(0); opacity: .92; }
</style></head>
<body><div id="stage"><div id="glow"></div></div>
<script src="timeline.js"></script>
</body></html>
