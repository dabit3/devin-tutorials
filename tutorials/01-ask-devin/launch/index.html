<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Inter'; src: url('/_kit/fonts/Inter-VF.ttf') format('truetype'); font-weight: 100 900; }
html, body { margin: 0; padding: 0; background: #f5f5f7; }
#stage { position: relative; width: 3840px; height: 2160px; overflow: hidden; font-family: 'Inter', sans-serif;
  background: radial-gradient(120% 90% at 50% 0%, #ffffff 0%, #f5f5f7 55%, #ececef 100%); color: #1d1d1f; }
.card { position: absolute; overflow: hidden; background: #fafafa; border-radius: 40px;
  box-shadow: 0 50px 140px rgba(0,0,0,.14), 0 12px 36px rgba(0,0,0,.06), 0 0 0 2px rgba(0,0,0,.07); }
.card img { position: absolute; left: 0; top: 0; display: block; }
.ring { position: absolute; border: 7px solid #317cff; border-radius: 22px; box-sizing: border-box;
  box-shadow: 0 0 0 16px rgba(49,124,255,.16), 0 0 50px rgba(49,124,255,.35); }
.ripple { position: absolute; border-radius: 50%; border: 6px solid #317cff; box-sizing: border-box; }
.cursor { position: absolute; width: 64px; height: 92px; transform-origin: 0 0; }
.txt { position: absolute; white-space: nowrap; letter-spacing: -0.035em; line-height: 1.04; }
.txt .w { display: inline-block; will-change: auto; }
.wrap { white-space: normal; }
#logo { position: absolute; left: 0; top: 0; }
#fade { position: absolute; inset: 0; background: #fff; opacity: 0; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// ---------- timing helpers ----------
const E = {
  linear: p => p,
  inOutCubic: p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2,
  outCubic: p => 1 - Math.pow(1 - p, 3),
  inCubic: p => p*p*p,
  outExpo: p => p >= 1 ? 1 : 1 - Math.pow(2, -10*p),
  outQuint: p => 1 - Math.pow(1 - p, 5),
  inOutQuint: p => p < .5 ? 16*p*p*p*p*p : 1 - Math.pow(-2*p + 2, 5) / 2,
  outBack: p => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3*Math.pow(p - 1, 3) + c1*Math.pow(p - 1, 2); },
};
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => Array.isArray(a) ? a.map((v, i) => v + (b[i] - v) * p) : a + (b - a) * p;
// keys: [[t, value, ease]] ; ease is used for the segment that starts at that key
function kf(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++) {
    const [t0, v0, e] = keys[i], [t1, v1] = keys[i + 1];
    if (t < t1) return lerp(v0, v1, E[e || 'inOutCubic'](clamp((t - t0) / (t1 - t0))));
  }
  return keys[keys.length - 1][1];
}
const prog = (t, t0, d, e = 'outExpo') => E[e](clamp((t - t0) / d));

// ---------- layout ----------
const W = 3840, H = 2160, CW = 1440, CH = 810;      // stage px, shot CSS px (shots are 3x)
const Lc = [520, 470, 2800, 1575];                   // centered card, headline above
const Lr = [1480, 330, 2700, 1518.75];               // card bleeds off the right, text on the left
const OFF = [520, 2350, 2800, 1575];
const SLOT = [[200, 1060, 1080, 607.5], [1380, 1060, 1080, 607.5], [2560, 1060, 1080, 607.5]];
const shot = n => `/01-ask-devin/shots/${String(n).padStart(4, '0')}.png`;

// shot schedule: [time, shot, crossfade]
const seq = (t0, t1, a, b) => { const out = []; const n = b - a; for (let i = 0; i <= n; i++) out.push([t0 + (t1 - t0) * i / n, a + i, 0.03]); return out; };
const MAIN_SHOTS = [
  [0, 0], [6.0, 2, .12], [8.35, 9, .2],
  ...seq(8.9, 10.9, 10, 32),
  [12.0, 33, .2], [12.5, 37, .1], [12.9, 39, .1], [13.2, 40, .1], [13.5, 41, .1], [13.8, 46, .1], [14.0, 47, .1],
  [14.25, 51, .08], [14.45, 52, .08], [14.6, 53, .08], [14.75, 54, .08], [14.9, 55, .08], [15.05, 57, .08],
  [15.2, 58, .08], [15.35, 60, .08], [15.5, 64, .08], [15.7, 68, .1],
  [17.78, 69, .06], [18.02, 70, .1],
  [20.25, 71, .15], ...seq(20.5, 21.3, 73, 88),
  [21.82, 89, .06], [22.02, 90, .06], [22.25, 91, .1], [22.6, 95, .08], [22.8, 96, .08], [23.0, 97, .08], [23.15, 98, .08],
  [23.3, 99, .08], [23.45, 100, .08], [23.6, 101, .08], [23.8, 108, .12], [24.25, 112, .2],
  [25.38, 113, .06], [25.52, 114, .1], [26.6, 129, .2],
];
function layers(t, list) {
  let i = 0; while (i + 1 < list.length && list[i + 1][0] <= t) i++;
  const cur = list[i]; if (i === 0) return [{ src: shot(cur[1]), a: 1 }];
  const p = clamp((t - cur[0]) / (cur[2] || .1));
  return p >= 1 ? [{ src: shot(cur[1]), a: 1 }] : [{ src: shot(list[i - 1][1]), a: 1 }, { src: shot(cur[1]), a: E.inOutCubic(p) }];
}

// ---------- main card motion ----------
const MAIN_RECT = [
  [3.25, OFF, 'outQuint'], [4.25, Lc], [11.7, Lc, 'inOutQuint'], [12.5, Lr], [15.8, Lr, 'inOutQuint'], [16.6, Lc],
  [19.8, Lc, 'inOutQuint'], [20.6, Lr], [23.85, Lr, 'inOutQuint'], [24.65, Lc], [28.0, Lc, 'inOutQuint'], [28.8, SLOT[2]],
];
const MAIN_CAM = [
  [0, [720, 405, 1]], [4.5, [720, 405, 1], 'inOutCubic'], [5.4, [872, 370, 1.8]], [7.3, [872, 370, 1.8], 'inOutCubic'],
  [8.2, [870, 410, 1.9], 'linear'], [11.55, [870, 410, 2.05], 'inOutCubic'], [12.4, [860, 190, 2.0], 'linear'],
  [13.75, [860, 200, 2.1], 'inOutCubic'], [14.6, [720, 405, 1.0], 'linear'], [15.85, [720, 405, 1.08], 'inOutCubic'],
  [16.9, [612, 250, 2.6], 'linear'], [18.08, [622, 252, 2.68], 'inOutCubic'], [19.0, [1105, 270, 2.0], 'linear'],
  [19.85, [1105, 270, 2.08], 'inOutCubic'], [20.65, [530, 722, 2.0], 'linear'], [22.08, [540, 722, 2.08], 'inOutCubic'],
  [23.0, [530, 330, 1.6], 'linear'], [24.2, [530, 335, 1.62], 'inOutCubic'], [24.95, [470, 560, 1.9], 'linear'],
  [25.65, [470, 565, 1.95], 'inOutCubic'], [26.7, [560, 380, 1.3], 'linear'], [28.0, [560, 380, 1.33], 'inOutCubic'],
  [28.8, [720, 405, 1.0]],
];
const CURSORS = [ // [tIn, from, tArrive, to, tClick, tOutStart]
  [5.15, [980, 470], 5.85, [1184, 314], 6.0, 7.0],
  [17.0, [720, 330], 17.75, [635, 252], 18.0, 18.55],
  [21.3, [640, 700], 21.8, [571, 775], 22.0, 22.5],
  [24.85, [560, 500], 25.35, [469, 582], 25.5, 26.0],
];
const RINGS = [ // [t0, t1, x, y, w, h]
  [6.05, 7.4, 1158, 299, 52, 30],
  [16.95, 18.1, 574, 241, 122, 22],
  [18.95, 19.8, 781, 204, 648, 142],
  [21.45, 22.15, 465, 760, 212, 30],
  [24.9, 25.6, 397, 566, 145, 32],
  [26.8, 27.85, 8, 304, 284, 44],
  [26.9, 27.85, 326, 535, 414, 72],
];

// ---------- text ----------
const TEXTS = [
  // id, words, x, y, align, size, weight, color, word in-times, tOut
  { words: ['Ask', 'Devin'], x: 1920, y: 860, align: 'center', size: 300, weight: 700, tin: [0.42, 0.92], tout: 2.95 },
  { words: ['anything', 'about', 'your', 'code.'], x: 1920, y: 1190, align: 'center', size: 300, weight: 600, color: '#86868b', tin: [1.42, 1.92, 2.17, 2.42], tout: 2.95 },
  { words: ['Switch', 'to', 'Ask', 'mode'], top: 1, tin: 4.15, tout: 7.75 },
  { words: ['Ask', 'in', 'plain', 'English'], top: 1, tin: 8.1, tout: 11.6 },
  { words: ['Devin', 'reads', 'the', 'code'], left: 1, tin: 12.25, tout: 13.85 },
  { words: ['and', 'explains', 'it'], left: 1, tin: 14.0, tout: 15.75 },
  { words: ['Answers', 'cite', 'the', 'exact', 'lines'], top: 1, tin: 16.2, tout: 17.95 },
  { words: ['Click', 'to', 'jump', 'to', 'the', 'code'], top: 1, tin: 18.12, tout: 19.75 },
  { words: ['Then', 'plan', 'the', 'change'], left: 1, tin: 20.25, tout: 21.95 },
  { words: ['Devin', 'drafts', 'the', 'prompt'], left: 1, tin: 22.15, tout: 23.8 },
  { words: ['Start', 'building', 'in', 'one', 'click'], top: 1, tin: 24.2, tout: 25.45 },
  { words: ['Devin', 'gets', 'to', 'work'], top: 1, tin: 25.62, tout: 27.9 },
  { words: ['Ask', 'first.', 'Then', 'build.'], x: 1920, y: 560, align: 'center', size: 230, weight: 700, tin: [28.42, 28.67, 29.42, 29.67], tout: 31.25 },
  { words: ['Try', 'it', 'today', 'at', 'devin.ai'], x: 1920, y: 1390, align: 'center', size: 104, weight: 500, color: '#6e6e73', hi: 4, tin: 33.42, tout: 99 },
];

// ---------- DOM ----------
const stage = document.getElementById('stage');
const el = (cls, parent = stage, tag = 'div') => { const e = document.createElement(tag); e.className = cls; parent.appendChild(e); return e; };
function makeCard() {
  const c = el('card'); const imgs = [0, 1, 2].map(() => { const i = el('', c, 'img'); i.style.opacity = 0; return i; });
  const over = el('', c); over.style.cssText = 'position:absolute;inset:0;';
  return { c, imgs, over };
}
const cards = [makeCard(), makeCard(), makeCard()]; // montage A, montage B, main (main on top)
const main = cards[2];
const rings = RINGS.map(() => el('ring', main.over));
const ripple = el('ripple', main.over);
const cursor = el('cursor', main.over);
cursor.innerHTML = `<svg viewBox="0 0 16 23" width="64" height="92"><path d="M1 1 L1 18.2 L5.2 14.3 L7.9 20.6 L10.6 19.4 L7.9 13.2 L13.6 13.2 Z" fill="#000" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
const textEls = TEXTS.map(T => {
  const d = el('txt');
  if (T.top) Object.assign(T, { x: 1920, y: 268, align: 'center', size: 150, weight: 650 });
  if (T.left) Object.assign(T, { x: 220, y: 1080, align: 'left', size: 168, weight: 700, wrap: 1150 });
  d.style.fontSize = T.size + 'px'; d.style.fontWeight = T.weight; d.style.color = T.color || '#1d1d1f';
  if (T.wrap) { d.classList.add('wrap'); d.style.width = T.wrap + 'px'; }
  T.spans = T.words.map((w, i) => { const s = el('w', d, 'span'); s.textContent = w; if (T.hi === i) { s.style.color = '#1d1d1f'; s.style.fontWeight = 650; }
    d.appendChild(document.createTextNode(i < T.words.length - 1 ? ' ' : '')); return s; });
  return d;
});
const logo = el('', stage, 'img'); logo.id = 'logo'; logo.src = '/_kit/brand/DEVIN_LOCKUP_HORIZONTAL_WHITE_TRANSPARENT.png';
const fade = el(''); fade.id = 'fade';

// ---------- card rendering ----------
async function drawCard(card, t, rect, cam, shotLayers, opacity = 1, extra = {}) {
  const [x, y, w, h] = rect, [cx, cy, z] = cam;
  const s = card.c.style;
  s.left = x + 'px'; s.top = y + 'px'; s.width = w + 'px'; s.height = h + 'px'; s.opacity = opacity;
  s.borderRadius = (40 * Math.min(1, w / 2800) + 10) + 'px';
  s.display = opacity <= 0.001 ? 'none' : 'block';
  // focus point = visible centre of the card
  const vx0 = Math.max(x, 0), vx1 = Math.min(x + w, W), vy0 = Math.max(y, 0), vy1 = Math.min(y + h, H);
  const fx = (vx0 + vx1) / 2 - x, fy = (vy0 + vy1) / 2 - y;
  const S = w / CW * z;
  let tx = fx - cx * S, ty = fy - cy * S;
  tx = Math.min(0, Math.max(w - CW * S, tx)); ty = Math.min(0, Math.max(h - CH * S, ty));
  card.map = (px, py) => [tx + px * S, ty + py * S]; card.S = S;
  const used = new Set(); const waits = [];
  for (const L of shotLayers) {
    let img = card.imgs.find(i => i.dataset.src === L.src && !used.has(i));
    if (!img) { img = card.imgs.find(i => !used.has(i) && !shotLayers.some(l => l.src === i.dataset.src)); img.dataset.src = L.src; img.src = L.src; }
    used.add(img); if (!img.complete || !img.naturalWidth) waits.push(img.decode().catch(() => {}));
    Object.assign(img.style, { left: tx + 'px', top: ty + 'px', width: CW * S + 'px', height: CH * S + 'px', opacity: L.a, zIndex: shotLayers.indexOf(L) });
  }
  for (const i of card.imgs) if (!used.has(i)) i.style.opacity = 0;
  await Promise.all(waits);
}

function drawMainOverlays(t) {
  const m = main.map;
  RINGS.forEach(([t0, t1, x, y, w, h], i) => {
    const r = rings[i]; const a = Math.min(prog(t, t0, .25, 'outCubic'), 1 - prog(t, t1 - .2, .2, 'linear'));
    if (a <= 0) { r.style.display = 'none'; return; }
    const pad = 14, sc = 1 + 0.12 * (1 - prog(t, t0, .35, 'outCubic'));
    const [X, Y] = m(x, y); const Wd = w * main.S + pad * 2, Hd = h * main.S + pad * 2;
    Object.assign(r.style, { display: 'block', left: X - pad + 'px', top: Y - pad + 'px', width: Wd + 'px', height: Hd + 'px', opacity: a, transform: `scale(${sc})` });
  });
  let cur = null;
  for (const [tin, from, tar, to, tclick, tout] of CURSORS) if (t >= tin && t < tout + .3) cur = { tin, from, tar, to, tclick, tout };
  if (!cur) { cursor.style.display = 'none'; ripple.style.display = 'none'; return; }
  const p = E.inOutCubic(clamp((t - cur.tin) / (cur.tar - cur.tin)));
  const [px, py] = lerp(cur.from, cur.to, p);
  const [X, Y] = m(px, py);
  const a = Math.min(prog(t, cur.tin, .2, 'linear'), 1 - prog(t, cur.tout, .3, 'linear'));
  const press = t >= cur.tclick - .06 && t < cur.tclick + .1 ? .85 : 1;
  Object.assign(cursor.style, { display: 'block', left: X - 6 + 'px', top: Y - 4 + 'px', opacity: a, transform: `scale(${press})` });
  const rp = (t - cur.tclick) / .5;
  if (rp >= 0 && rp <= 1) {
    const R = 30 + 110 * E.outCubic(rp);
    Object.assign(ripple.style, { display: 'block', left: X - R + 'px', top: Y - R + 'px', width: 2 * R + 'px', height: 2 * R + 'px', opacity: 1 - rp });
  } else ripple.style.display = 'none';
}

function drawTexts(t) {
  TEXTS.forEach((T, k) => {
    const d = textEls[k];
    const tins = Array.isArray(T.tin) ? T.tin : T.words.map((_, i) => T.tin + i * 0.07);
    if (t < tins[0] - .01 || t > T.tout + .45) { d.style.display = 'none'; return; }
    d.style.display = 'block';
    const bw = d.offsetWidth, bh = d.offsetHeight;
    const lx = T.align === 'center' ? T.x - bw / 2 : T.x;
    d.style.left = lx + 'px'; d.style.top = T.y - bh / 2 + 'px';
    const out = prog(t, T.tout, .4, 'inCubic');
    T.spans.forEach((s, i) => {
      const p = prog(t, tins[i], .6, 'outExpo');
      const o = clamp(p * 1.4) * (1 - out);
      const dy = (1 - p) * 0.42 * T.size - out * 0.25 * T.size;
      const blur = (1 - p) * 18 + out * 14;
      s.style.opacity = o; s.style.transform = `translateY(${dy}px) scale(${1 - out * 0.04})`;
      s.style.filter = blur > 0.3 ? `blur(${blur}px)` : 'none';
    });
  });
}

function drawLogo(t) {
  const LH = 340, sc = LH / 1024, NW = 2984 * sc;
  if (t < 31.9) { logo.style.display = 'none'; return; }
  const pop = prog(t, 31.92, .7, 'outBack'), fadeIn = prog(t, 31.92, .35, 'linear');
  const rev = prog(t, 32.42, .8, 'inOutQuint');
  const markC = 512.5 * sc, fullC = 1437 * sc;
  const right = lerp(861, 2984, rev);              // reveal right edge in source px
  const cx = lerp(markC, fullC, rev);
  Object.assign(logo.style, { display: 'block', height: LH + 'px', width: NW + 'px', left: 1920 - cx + 'px', top: 1010 - LH / 2 - 4 + 'px',
    opacity: fadeIn, transformOrigin: `${markC}px 50%`, transform: `scale(${0.55 + 0.45 * pop})`,
    clipPath: `inset(0 ${(2984 - right) * sc}px 0 0)`, filter: pop < .98 ? `invert(1) blur(${(1 - fadeIn) * 16}px)` : 'invert(1)' });
}

window.film = {
  fps: 60, duration: 37, get frames() { return Math.round(this.duration * this.fps); },
  ready: (async () => {
    await document.fonts.load('700 100px Inter'); await document.fonts.ready;
    await logo.decode().catch(() => {});
  })(),
  async renderFrame(f) {
    const t = f / this.fps;
    // main card
    const mainOpacity = t < 3.25 ? 0 : Math.min(prog(t, 3.25, .15, 'linear'), 1 - prog(t, 31.45, .5, 'inCubic'));
    let mrect = kf(t, MAIN_RECT);
    mrect = [mrect[0], mrect[1] + 260 * E.inCubic(clamp((t - 31.45) / .55)), mrect[2], mrect[3]];
    const waits = [drawCard(main, t, mrect, kf(t, MAIN_CAM), layers(t, MAIN_SHOTS), mainOpacity)];
    // montage cards
    const mont = [[28.12, 31.2, shot(32), [870, 410, 1.7]], [28.32, 31.32, shot(70), [720, 405, 1.0]]];
    mont.forEach(([tin, tout, src, cam], i) => {
      const p = prog(t, tin, .8, 'outQuint'), o = prog(t, tout, .5, 'inCubic');
      const r = SLOT[i]; const rect = [r[0], r[1] + (1 - p) * 700 + o * 260, r[2], r[3]];
      const op = t < tin ? 0 : Math.min(clamp(p * 2), 1 - o);
      waits.push(drawCard(cards[i], t, rect, cam, [{ src, a: 1 }], op));
    });
    await Promise.all(waits);
    drawMainOverlays(t);
    drawTexts(t);
    drawLogo(t);
    fade.style.opacity = prog(t, 36.35, .65, 'linear');
  },
};
// preview: index.html?t=12.5
const qt = new URLSearchParams(location.search).get('t');
if (qt !== null) window.film.ready.then(() => window.film.renderFrame(Math.round(Number(qt) * 60)));
</script>
