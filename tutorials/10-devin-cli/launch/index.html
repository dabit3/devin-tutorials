<!doctype html>
<html><head><meta charset="utf-8"><title>Devin CLI launch</title>
<style>
@font-face { font-family: 'Inter'; src: url('../../_kit/fonts/Inter-VF.ttf') format('truetype'); font-weight: 100 900; }
@font-face { font-family: 'JBM'; src: url('../../_kit/fonts/JetBrainsMono-VF.ttf') format('truetype'); font-weight: 100 900; }
html, body { margin: 0; background: #000; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #f2f2f4; font-family: 'Inter', sans-serif; color: #111; }
#glow { position: absolute; inset: -20%; background: radial-gradient(closest-side, rgba(255,255,255,0.95), rgba(255,255,255,0) 70%); }
.win { position: absolute; overflow: hidden; background: #141515; box-shadow: 0 30px 90px rgba(0,0,0,0.20), 0 6px 20px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.08); will-change: transform; }
.win.light { background: #fff; }
.cam { position: absolute; left: 0; top: 0; width: 1440px; height: 810px; transform-origin: 0 0; }
.cam img { position: absolute; left: 0; top: 0; width: 1440px; height: 810px; display: none; }
.spot { position: absolute; border-radius: 10px; box-shadow: 0 0 0 4000px rgba(0,0,0,0.5), inset 0 0 0 2px rgba(255,255,255,0.9); opacity: 0; }
.light .spot { box-shadow: 0 0 0 4000px rgba(0,0,0,0.28), inset 0 0 0 2px rgba(20,20,20,0.85); }
.txt { position: absolute; white-space: nowrap; letter-spacing: -0.035em; line-height: 1.05; }
.txt .w { display: inline-block; white-space: pre; will-change: transform, opacity, filter; }
.mono { font-family: 'JBM', monospace; letter-spacing: -0.02em; }
.gray { color: rgba(0,0,0,0.5); }
.lbl { position: absolute; font-family: 'JBM', monospace; font-size: 34px; color: rgba(0,0,0,0.55); transform: translateX(-50%); white-space: nowrap; }
#cursor { position: absolute; width: 26px; height: 38px; left: 0; top: 0; }
.ripple { position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 3px solid rgba(20,20,20,0.7); opacity: 0; }
#end { position: absolute; inset: 0; }
#lockWrap { position: absolute; left: 50%; top: 430px; width: 900px; height: 309px; margin-left: -450px; }
#lock { width: 100%; height: 100%; filter: brightness(0); opacity: 0.92; }
#cta { position: absolute; left: 0; right: 0; top: 760px; text-align: center; font-size: 60px; font-weight: 500; letter-spacing: -0.03em; }
#fade { position: absolute; inset: 0; background: #f2f2f4; opacity: 0; }
</style></head>
<body><div id="stage"><div id="glow"></div></div>
<script src="timeline.js"></script>
</body></html>
